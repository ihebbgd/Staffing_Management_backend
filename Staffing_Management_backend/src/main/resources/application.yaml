spring:
  application:
    name: Staffing_Management_backend
  mongodb:
    uri: "${MONGODB_URI}"
  data:
    mongodb:
      auto-index-creation: true
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

jwt:
  secret: "${JWT_SECRET}"
  access-expiration: 900000        # 15 minutes
  refresh-expiration: 604800000    # 7 days

recommendation:
  experience-cap-years: 10
  weights:
    skill-match: 0.40
    skill-level: 0.25
    availability: 0.20
    cert: 0.10
    experience: 0.05

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info   # only health (public) and info (authenticated) are exposed
  endpoint:
    health:
      show-details: when-authorized   # anonymous sees status only; details require an authorized user
  health:
    mongodb:
      enabled: false
logging:
  level:
    org.springframework.security: INFO
    # Production-safe default. Raise to DEBUG locally via the 'dev' profile or -Dlogging.level... when needed.
    com.demo.staffing_management_backend: INFO

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@staffing.local}
    password: ${APP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    sample-data: ${APP_SEED_SAMPLE_DATA:false}
    manager-password: ${APP_SEED_MANAGER_PASSWORD:Manager123!}
    employee-password: ${APP_SEED_EMPLOYEE_PASSWORD:Employee123!}
  certifications:
    refresh-cron: "0 0 2 * * *"
